name: Verificar Progressium (PWA)
on:
  push:
    branches: [main]
  workflow_dispatch:
  pull_request:
permissions:
  contents: read
concurrency:
  group: pwa-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run verify:identity
      - run: npm run verify:icons
      - run: npm test -- --watch=false
      - run: npm run build
      - run: npm run validate:catalog
      - run: npx playwright install chromium || npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capturas-y-pruebas
          path: |
            docs/capturas/
            playwright-report/
# La PWA ya no se publica en GitHub Pages: va dentro de la imagen Docker (server.yml),
# servida desde la misma instancia que la API.
