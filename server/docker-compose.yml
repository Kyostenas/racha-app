# Progressium · PWA + API de la comunidad en el mismo origen. Proyecto de compose propio (no comparte red ni
# volúmenes con otros servicios del equipo). Configura todo en .env (ver .env.example).
name: progressium
services:
  progressium:
    image: ${PROGRESSIUM_IMAGE:-ghcr.io/kyostenas/progressium}:${PROGRESSIUM_TAG:-latest}
    build:
      context: ..
      dockerfile: server/Dockerfile
      args:
        PROGRESSIUM_VERSION: ${PROGRESSIUM_TAG:-local}
    restart: unless-stopped
    environment:
      PROGRESSIUM_ORIGINS: ${PROGRESSIUM_ORIGINS:-}
      PB_ENCRYPTION_KEY: ${PB_ENCRYPTION_KEY:-}
      PROGRESSIUM_SALES_SECRET: ${PROGRESSIUM_SALES_SECRET:-}
      TZ: ${TZ:-America/Mexico_City}
      # Límite suave del runtime de Go: funciona aunque el kernel no tenga cgroups de memoria (p. ej. Android).
      GOMEMLIMIT: ${PROGRESSIUM_GOMEMLIMIT:-200MiB}
      GOMAXPROCS: ${PROGRESSIUM_GOMAXPROCS:-2}
    ports:
      - "${PROGRESSIUM_BIND:-127.0.0.1}:${PROGRESSIUM_PORT:-8090}:8090"
    volumes:
      - datos:/pb/pb_data
    # Límite duro (cgroups). Algunos kernels lo ignoran con una advertencia; ahí manda GOMEMLIMIT.
    mem_limit: ${PROGRESSIUM_MEM:-256m}
    pids_limit: 200
    read_only: true
    tmpfs:
      - /tmp:size=32m
    security_opt:
      - no-new-privileges:true
    cap_drop: [ALL]
    # Usuario sin privilegios por defecto. En kernels Android (CONFIG_ANDROID_PARANOID_NETWORK) un uid sin
    # privilegios no puede abrir sockets; install.sh lo detecta y usa 0:0 (sin capacidades: cap_drop ALL).
    user: "${PROGRESSIUM_USER:-10001:10001}"
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
  # Publicación HTTPS con Tailscale Funnel como nodo propio «progressium» (perfil opcional).
  # Solo arranca si hay TS_AUTHKEY en .env (o con ./install.sh --funnel cuando el nodo ya está unido).
  tailscale:
    image: tailscale/tailscale:${TS_IMAGE_TAG:-stable}
    profiles: ["funnel"]
    # Sin «hostname:» a propósito: si el contenedor se llamara «progressium», el proxy de serve.json
    # (http://progressium:8090) se resolvería a sí mismo. El nombre del nodo lo da TS_HOSTNAME.
    restart: unless-stopped
    depends_on: [progressium]
    environment:
      TS_AUTHKEY: ${TS_AUTHKEY:-}
      TS_HOSTNAME: ${TS_HOSTNAME:-progressium}
      TS_STATE_DIR: /var/lib/tailscale
      TS_USERSPACE: "true"
      TS_SERVE_CONFIG: /config/serve.json
      TS_EXTRA_ARGS: ${TS_EXTRA_ARGS:-}
    volumes:
      - tailscale:/var/lib/tailscale
      - ./tailscale:/config:ro
    mem_limit: 128m
    logging:
      driver: json-file
      options: { max-size: "5m", max-file: "3" }
volumes:
  datos:
  tailscale:
